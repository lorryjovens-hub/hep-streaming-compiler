<!DOCTYPE html><html><head><meta charset='utf-8'><title>HEP 流式编译 · 烤羊腿计划</title><style>body{background:#F5EFE4;color:#2A2622;padding:32px;font-family:-apple-system,'PingFang SC',sans-serif;--text:#2A2622;--text-light:#4A433C;--text-muted:#6B6158;--border:#D8CFBE;--accent:#537D96;--bg-card:#FBF7EE;--radius-chat-card:4px;--font-serif:'Noto Serif SC',serif;--font-ui:sans-serif;}</style></head><body><h2 id="h1" style="font-family:var(--font-serif);font-weight:500;color:var(--text);margin:.6em 0 .3em">周日烤羊腿计划</h2>
<label id="s1" style="display:flex;flex-direction:column;gap:4px;font-family:var(--font-ui);font-size:.78rem;color:var(--text-muted)">人数<input type="range" min="2" max="12" value="4" data-hep-input="guests" style="width:170px"><span data-hep-echo="guests" style="color:var(--accent);font-variant-numeric:tabular-nums">4</span></label>
<div id="st1" style="min-width:72px"><div style="font-size:.75rem;color:var(--text-muted);font-family:var(--font-ui)">羊腿重量</div><div style="font-size:1.5rem;font-weight:600;color:var(--accent);font-family:var(--font-ui);font-variant-numeric:tabular-nums">3.2 kg</div></div>
<div id="st2" style="min-width:72px"><div style="font-size:.75rem;color:var(--text-muted);font-family:var(--font-ui)">西兰花</div><div style="font-size:1.5rem;font-weight:600;color:var(--accent);font-family:var(--font-ui);font-variant-numeric:tabular-nums">625 g</div></div>
<div id="st3" style="min-width:72px"><div style="font-size:.75rem;color:var(--text-muted);font-family:var(--font-ui)">苹果</div><div style="font-size:1.5rem;font-weight:600;color:var(--accent);font-family:var(--font-ui);font-variant-numeric:tabular-nums">4 个</div></div>
<figure id="ch1" style="margin:.4em 0"><svg viewBox="0 0 360 130" style="width:100%;max-width:360px"><line x1="20" y1="110" x2="345" y2="110" stroke="var(--border)"/><rect x="34.4" y="110.0" width="51.2" height="0.0" fill="var(--accent)" opacity=".8"/><rect x="114.4" y="84.8" width="51.2" height="25.2" fill="var(--accent)" opacity=".8"/><rect x="194.4" y="56.0" width="51.2" height="54.0" fill="var(--accent)" opacity=".8"/><rect x="274.4" y="20.0" width="51.2" height="90.0" fill="var(--accent)" opacity=".8"/></svg><figcaption style="font-size:.72rem;color:var(--text-muted);font-family:var(--font-ui)">配料随人数联动（克）</figcaption></figure>
<ul id="cl1" style="list-style:none;margin:.4em 0"><li style="display:flex;gap:8px;align-items:center;padding:3px 0"><span style="color:var(--accent)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></span><span style="font-family:var(--font-serif);font-size:.84rem;color:var(--text)">周六 18:00 腌制</span></li><li style="display:flex;gap:8px;align-items:center;padding:3px 0"><span style="color:var(--accent)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></span><span style="font-family:var(--font-serif);font-size:.84rem;color:var(--text)">周日 12:30 备菜</span></li><li style="display:flex;gap:8px;align-items:center;padding:3px 0"><span style="color:var(--accent)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></span><span style="font-family:var(--font-serif);font-size:.84rem;color:var(--text)">13:30 入烤箱</span></li><li style="display:flex;gap:8px;align-items:center;padding:3px 0"><span style="color:var(--accent)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></span><span style="font-family:var(--font-serif);font-size:.84rem;color:var(--text)">16:00 开饭</span></li></ul>
<div id="nt1" style="display:flex;gap:8px;align-items:flex-start;background:rgba(83,125,150,.08);border-left:2px solid var(--accent);padding:8px 12px;border-radius:0;font-family:var(--font-serif);font-size:.84rem;color:var(--text)"><span style="color:var(--accent);flex:none;margin-top:2px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><line x1="12" y1="8" x2="12" y2="8"/></svg></span><span>人数变化时配料自动重算</span></div></body></html>
